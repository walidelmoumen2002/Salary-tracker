<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Salary Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/recharts/umd/Recharts.min.js"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
      :root {
        /* Shadcn-compatible HSL vars — updated to match new warm-green palette */
        --background: 48 30% 98%;
        --foreground: 32 8% 15%;
        --card: 0 0% 100%;
        --card-foreground: 32 8% 15%;
        --popover: 0 0% 100%;
        --popover-foreground: 32 8% 15%;
        --primary: 151 32% 37%;
        --primary-foreground: 0 0% 100%;
        --secondary: 48 20% 95%;
        --secondary-foreground: 32 8% 15%;
        --muted: 48 20% 95%;
        --muted-foreground: 32 5% 38%;
        --accent: 151 20% 93%;
        --accent-foreground: 151 32% 25%;
        --destructive: 0 84.2% 60.2%;
        --destructive-foreground: 0 0% 98%;
        --border: 48 10% 89%;
        --input: 48 10% 89%;
        --ring: 151 32% 37%;

        /* Design-system tokens (direct color values) */
        --paper:        oklch(0.991 0.003 95);
        --surface:      #ffffff;
        --ink:          oklch(0.23 0.008 75);
        --faint:        oklch(0.72 0.012 75);
        --line:         oklch(0.92 0.004 95);
        --accent-color: oklch(0.52 0.095 158);
        --accent-soft:  oklch(0.955 0.028 158);
        --warn-color:   oklch(0.58 0.115 45);
        --warn-soft:    oklch(0.955 0.03 55);
        --radius:       0px;
        --row-pad:      0.875rem;
      }

      html { scroll-behavior: smooth; }

      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font-family: "Plus Jakarta Sans", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      /* Design utility classes */
      .r { border-radius: var(--radius); }

      .num {
        font-variant-numeric: tabular-nums;
        letter-spacing: -0.01em;
      }

      .eyebrow {
        font-family: "JetBrains Mono", monospace;
        text-transform: uppercase;
        letter-spacing: 0.13em;
        font-size: 0.6875rem;
        font-weight: 500;
        color: var(--faint);
        white-space: nowrap;
      }

      .focus-ring:focus-visible {
        outline: 2px solid var(--accent-color);
        outline-offset: 2px;
      }

      /* Scrollbars */
      ::-webkit-scrollbar { width: 9px; height: 9px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 99px; }
      ::-webkit-scrollbar-thumb:hover { background: var(--faint); }

      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

      /* Existing utility aliases */
      .safe-area-bottom { padding-bottom: env(safe-area-inset-bottom, 0px); }
      .scrollbar-hide::-webkit-scrollbar { display: none; }

      /* Animations */
      @keyframes slideUp   { from { transform: translateY(100%); } to { transform: translateY(0); } }
      @keyframes slideRight { from { transform: translateX(100%); } to { transform: translateX(0); } }
      @keyframes fadeIn    { from { opacity: 0; } to { opacity: 1; } }
      @keyframes slideInFromRight { from { transform: translateX(100%); } to { transform: translateX(0); } }
      @keyframes slideInFromTop   { from { transform: translateY(-100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
      @keyframes zoomIn95  { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }

      .slide-up    { animation: slideUp    .38s cubic-bezier(0.16,1,0.3,1); }
      .slide-right { animation: slideRight .38s cubic-bezier(0.16,1,0.3,1); }
      .overlay-in  { animation: fadeIn .25s ease; }
      .animate-in  { animation-duration: 300ms; animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1); animation-fill-mode: forwards; }
      .fade-in     { animation-name: fadeIn; }
      .slide-in-from-right { animation-name: slideInFromRight; }
      .slide-in-from-top   { animation: slideInFromTop 300ms cubic-bezier(0.16, 1, 0.3, 1); }
      .zoom-in-95  { animation-name: zoomIn95; }
    </style>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              /* New design tokens */
              paper:         "var(--paper)",
              surface:       "var(--surface)",
              ink:           "var(--ink)",
              faint:         "var(--faint)",
              line:          "var(--line)",
              "accent-soft": "var(--accent-soft)",
              "warn-soft":   "var(--warn-soft)",

              /* Shadcn/legacy tokens */
              border:     "hsl(var(--border))",
              input:      "hsl(var(--input))",
              ring:       "hsl(var(--ring))",
              background: "hsl(var(--background))",
              foreground: "hsl(var(--foreground))",
              primary: {
                DEFAULT:    "hsl(var(--primary))",
                foreground: "hsl(var(--primary-foreground))",
              },
              secondary: {
                DEFAULT:    "hsl(var(--secondary))",
                foreground: "hsl(var(--secondary-foreground))",
              },
              destructive: {
                DEFAULT:    "hsl(var(--destructive))",
                foreground: "hsl(var(--destructive-foreground))",
              },
              muted: {
                DEFAULT:    "hsl(var(--muted))",
                foreground: "hsl(var(--muted-foreground))",
              },
              accent: {
                DEFAULT:    "hsl(var(--accent))",
                foreground: "hsl(var(--accent-foreground))",
              },
              popover: {
                DEFAULT:    "hsl(var(--popover))",
                foreground: "hsl(var(--popover-foreground))",
              },
              card: {
                DEFAULT:    "hsl(var(--card))",
                foreground: "hsl(var(--card-foreground))",
              },
            },
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
              mono: ['"JetBrains Mono"', 'ui-monospace', 'monospace'],
            },
            borderRadius: {
              lg: "0.5rem",
              md: "calc(0.5rem - 2px)",
              sm: "calc(0.5rem - 4px)",
            },
          }
        }
      }
    </script>
    <script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "recharts": "https://aistudiocdn.com/recharts@^3.3.0",
    "@supabase/supabase-js": "https://aistudiocdn.com/@supabase/supabase-js@^2.45.0"
  }
}
</script>
  </head>
  <body class="bg-paper">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
